<svg viewBox="0 0 680 322" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>宝信软件2026年上半年分部毛利率同比变化</title>
<desc>哑铃图展示四个分部2025年与2026年上半年毛利率对比：软件开发及工程服务29.70%降至23.70%，服务外包44.76%降至42.97%，系统集成6.86%升至10.94%，主营业务合计34.91%降至29.72%。</desc>
<text x="40" y="22" font-size="14" font-weight="500" fill="#2C2C2A">毛利率掉在哪一块（2025H1 对比 2026H1）</text>
<text x="40" y="42" font-size="12" fill="#5F5E5A">横轴为分部毛利率，右侧为 2026H1 收入体量</text>
<line x1="130.0" y1="70" x2="130.0" y2="254" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="130.0" y="64" font-size="11" fill="#888780" text-anchor="middle">0%</text>
<line x1="204.0" y1="70" x2="204.0" y2="254" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="204.0" y="64" font-size="11" fill="#888780" text-anchor="middle">10%</text>
<line x1="278.0" y1="70" x2="278.0" y2="254" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="278.0" y="64" font-size="11" fill="#888780" text-anchor="middle">20%</text>
<line x1="352.0" y1="70" x2="352.0" y2="254" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="352.0" y="64" font-size="11" fill="#888780" text-anchor="middle">30%</text>
<line x1="426.0" y1="70" x2="426.0" y2="254" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="426.0" y="64" font-size="11" fill="#888780" text-anchor="middle">40%</text>
<line x1="500.0" y1="70" x2="500.0" y2="254" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="500.0" y="64" font-size="11" fill="#888780" text-anchor="middle">50%</text>
<text x="120" y="100" font-size="12.5" fill="#2C2C2A" text-anchor="end">软件开发及工程服务 67.9%</text>
<line x1="349.7" y1="96" x2="305.4" y2="96" stroke="#B4B2A9" stroke-width="2"/>
<circle cx="349.7" cy="96" r="5" fill="#F1EFE8" stroke="#888780" stroke-width="1.2"/>
<circle cx="305.4" cy="96" r="5.5" fill="#378ADD" stroke="#185FA5" stroke-width="1"/>
<text x="296.4" y="118" font-size="11.5" fill="#0C447C" text-anchor="end">23.70%</text>
<text x="358.7" y="118" font-size="11.5" fill="#5F5E5A">29.69%</text>
<text x="520" y="93" font-size="12" fill="#A32D2D">-5.99pct</text>
<text x="520" y="111" font-size="11.5" fill="#888780">38.17 亿</text>
<text x="120" y="146" font-size="12.5" fill="#2C2C2A" text-anchor="end">服务外包 31.6%</text>
<line x1="461.2" y1="142" x2="447.9" y2="142" stroke="#B4B2A9" stroke-width="2"/>
<circle cx="461.2" cy="142" r="5" fill="#F1EFE8" stroke="#888780" stroke-width="1.2"/>
<circle cx="447.9" cy="142" r="5.5" fill="#378ADD" stroke="#185FA5" stroke-width="1"/>
<text x="438.9" y="164" font-size="11.5" fill="#0C447C" text-anchor="end">42.97%</text>
<text x="470.2" y="164" font-size="11.5" fill="#5F5E5A">44.76%</text>
<text x="520" y="139" font-size="12" fill="#A32D2D">-1.79pct</text>
<text x="520" y="157" font-size="11.5" fill="#888780">17.76 亿</text>
<text x="120" y="192" font-size="12.5" fill="#2C2C2A" text-anchor="end">系统集成 0.5%</text>
<line x1="180.7" y1="188" x2="210.9" y2="188" stroke="#B4B2A9" stroke-width="2"/>
<circle cx="180.7" cy="188" r="5" fill="#F1EFE8" stroke="#888780" stroke-width="1.2"/>
<circle cx="210.9" cy="188" r="5.5" fill="#378ADD" stroke="#185FA5" stroke-width="1"/>
<text x="201.9" y="210" font-size="11.5" fill="#0C447C" text-anchor="end">10.94%</text>
<text x="189.7" y="210" font-size="11.5" fill="#5F5E5A">6.86%</text>
<text x="520" y="185" font-size="12" fill="#3B6D11">+4.08pct</text>
<text x="520" y="203" font-size="11.5" fill="#888780">0.30 亿</text>
<text x="120" y="238" font-size="12.5" fill="#2C2C2A" text-anchor="end">主营业务合计</text>
<line x1="388.4" y1="234" x2="349.9" y2="234" stroke="#B4B2A9" stroke-width="2"/>
<circle cx="388.4" cy="234" r="5" fill="#F1EFE8" stroke="#888780" stroke-width="1.2"/>
<circle cx="349.9" cy="234" r="5.5" fill="#378ADD" stroke="#185FA5" stroke-width="1"/>
<text x="340.9" y="256" font-size="11.5" fill="#0C447C" text-anchor="end">29.72%</text>
<text x="397.4" y="256" font-size="11.5" fill="#5F5E5A">34.91%</text>
<text x="520" y="231" font-size="12" fill="#A32D2D">-5.20pct</text>
<text x="520" y="249" font-size="11.5" fill="#888780">56.23 亿</text>
<line x1="40" y1="268" x2="640" y2="268" stroke="#D3D1C7" stroke-width="0.5"/>
<circle cx="46" cy="286" r="5" fill="#F1EFE8" stroke="#888780" stroke-width="1.2"/>
<text x="58" y="290" font-size="11.5" fill="#5F5E5A">2025H1</text>
<circle cx="130" cy="286" r="5.5" fill="#378ADD" stroke="#185FA5" stroke-width="1"/>
<text x="142" y="290" font-size="11.5" fill="#5F5E5A">2026H1</text>
<text x="40" y="312" font-size="11.5" fill="#888780">毛利率按（收入−成本）÷收入自算；2025H1 数据取自 2025 年半年报同表</text>
</svg>