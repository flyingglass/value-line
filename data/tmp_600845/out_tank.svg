<text x="58" y="406" font-size="11.5" fill="#5F5E5A">本期新增预收（推算）</text>
<rect x="216" y="396" width="12" height="12" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
<text x="234" y="406" font-size="11.5" fill="#5F5E5A">从期初合同负债结转成收入</text>
<text x="40" y="430" font-size="11.5" fill="#888780">新增预收＝期末余额−期初余额＋本期结转，属推算；余额取自两期资产负债表，结转额取自各期附注</text>
</svg>