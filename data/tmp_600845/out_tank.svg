<text x="92" y="314.0" font-size="11" fill="#888780" text-anchor="end">0</text>
<line x1="100" y1="260.0" x2="600" y2="260.0" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="92" y="264.0" font-size="11" fill="#888780" text-anchor="end">5</text>
<line x1="100" y1="210.0" x2="600" y2="210.0" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="92" y="214.0" font-size="11" fill="#888780" text-anchor="end">10</text>
<line x1="100" y1="160.0" x2="600" y2="160.0" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="92" y="164.0" font-size="11" fill="#888780" text-anchor="end">15</text>
<line x1="100" y1="110.0" x2="600" y2="110.0" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="92" y="114.0" font-size="11" fill="#888780" text-anchor="end">20</text>
<rect x="142.0" y="151.8" width="70.0" height="158.2" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<rect x="228.0" y="198.7" width="70.0" height="111.3" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
<text x="177.0" y="144.8" font-size="12.5" fill="#0C447C" text-anchor="middle">15.82</text>
<text x="263.0" y="191.7" font-size="12.5" fill="#854F0B" text-anchor="middle">11.13</text>
<text x="220.0" y="330.0" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle">2025年上半年</text>
<text x="220.0" y="352.0" font-size="12.5" fill="#3B6D11" text-anchor="middle">池子净变化 +4.70 亿</text>
<text x="220.0" y="370.0" font-size="11.5" fill="#888780" text-anchor="middle">期初 26.88 → 期末 31.58</text>
<rect x="382.0" y="199.8" width="70.0" height="110.2" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<rect x="468.0" y="163.3" width="70.0" height="146.7" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
<text x="417.0" y="192.8" font-size="12.5" fill="#0C447C" text-anchor="middle">11.02</text>
<text x="503.0" y="156.3" font-size="12.5" fill="#854F0B" text-anchor="middle">14.67</text>
<text x="460.0" y="330.0" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle">2026年上半年</text>
<text x="460.0" y="352.0" font-size="12.5" fill="#A32D2D" text-anchor="middle">池子净变化 -3.65 亿</text>
<text x="460.0" y="370.0" font-size="11.5" fill="#888780" text-anchor="middle">期初 32.30 → 期末 28.65</text>
<line x1="100" y1="310.0" x2="600" y2="310.0" stroke="#5F5E5A" stroke-width="0.8"/>
