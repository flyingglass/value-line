<svg viewBox="0 0 680 440" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>宝信软件合同负债蓄水池的进水与出水</title>
<desc>柱状对比：2025年上半年新增预收15.82亿元、结转收入11.13亿元，池子净增4.70亿元；2026年上半年新增预收降至11.02亿元、结转升至14.67亿元，池子净减3.65亿元。</desc>
<text x="40" y="22" font-size="14" font-weight="500" fill="#2C2C2A">合同负债这个蓄水池：去年进水多、今年出水多</text>
<text x="40" y="42" font-size="12" fill="#5F5E5A">单位：亿元。进水＝本期新收到的预收款，出水＝本期转成收入的预收款</text>
