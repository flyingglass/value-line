<svg width="100%" viewBox="0 0 680 250" role="img" xmlns="http://www.w3.org/2000/svg">
<title>可转债规则盯盘地图</title>
<desc>可转债规则按买入前、持有中、退出期三个阶段归类，核心主线是价内盯正股、价外盯信用。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="40" y="40" width="186" height="32" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="133" y="56" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">买入前：定锚</text>
<rect x="247" y="40" width="186" height="32" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="56" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">持有中：盯事件</text>
<rect x="454" y="40" width="186" height="32" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="547" y="56" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#791F1F">退出期：盯日期</text>
<rect x="40" y="80" width="186" height="28" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="50" y="94" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#444441">转股价值 / 溢价率 / 债底</text>
<rect x="40" y="112" width="186" height="28" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="50" y="126" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#444441">评级 + 正股是否 ST</text>
<rect x="40" y="144" width="186" height="28" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="50" y="158" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#444441">下修 / 强赎 / 回售触发线</text>
<rect x="40" y="176" width="186" height="28" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="50" y="190" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#444441">价格分位低 ≠ 溢价便宜</text>
<rect x="247" y="80" width="186" height="28" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="257" y="94" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#444441">平价：正股决定价内程度</text>
<rect x="247" y="112" width="186" height="28" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="257" y="126" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#444441">下修提议 / 强赎公告</text>
<rect x="247" y="144" width="186" height="28" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="257" y="158" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#444441">评级下调 / 兑付舆情</text>
<rect x="247" y="176" width="186" height="28" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="257" y="190" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#444441">余额 &lt; 3000 万会提前停牌</text>
<rect x="454" y="80" width="186" height="28" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="464" y="94" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#791F1F">T-20：≥3 次提示公告</text>
<rect x="454" y="112" width="186" height="28" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="464" y="126" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#791F1F">T-3：停止交易</text>
<rect x="454" y="144" width="186" height="28" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="464" y="158" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#791F1F">T 日 15:00：最后转股</text>
<rect x="454" y="176" width="186" height="28" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="464" y="190" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#791F1F">错过 → 按兑付价被动成交</text>
<rect x="40" y="216" width="600" height="26" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="229" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="500" fill="#085041">主线：深度价内盯正股（金诚）；深度价外盯信用（破面券）——两者规则完全不同</text>
</svg>
