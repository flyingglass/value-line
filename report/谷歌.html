that are subject to risks and uncertainties, which could cause our actual results to differ materially from those reflected in the forward-looking statements.\nFactors that could cause or contribute to such differences include, but are not limited to, those discussed in this Annual Report on Form 10-K, including the risks discussed in Part I, Item 1A \"Risk Factors\" and the trends discussed in Part II, Item 7 \"Management's Discussion and Analysis of Financial Condition and Results of Operations,\" and those discussed in other documents we file with the SEC.\nWe undertake no obligation to revise or publicly release the results of any revision to these forward-looking statements, except as required by law.\nGiven these risks and uncertainties, readers are cautioned not to place undue reliance on such forward-looking statements.\nAs used herein, \"Alphabet,\" \"the company,\" \"we,\" \"us,\" \"our,\" and similar terms include Alphabet Inc.\nand its subsidiaries, unless the context indicates otherwise.\n\"Alphabet,\" \"Google,\" and other trademarks of ours appearing in this report are our property.\nWe do not intend our use or display of other companies' trade names or trademarks to imply an endorsement or sponsorship of us by such companies, or any relationship with any of these companies.\nPART I ITEM 1.\nBUSINESS Overview As our founders Larry and Sergey wrote in the original founders' letter, \"Google is not a conventional company.\nWe do not intend to become one.\" That unconventional spirit has been a driving force throughout our history, inspiring us to tackle big problems and invest in moonshots.\nIt led us to be a pioneer in the development of artificial intelligence (AI) and, since 2016, be an AI-first company.\nWe continue this work under the leadership of Alphabet and Google CEO, Sundar Pichai.\nAlphabet is a collection of businesses — the largest of which is Google.\nWe report Google in two segments, Google Services and Google Cloud, and all non-Google businesses collectively as Other Bets.\nSupporting these businesses, we have centralized certain AI-related research and development focused on advanced research in AI and developing the frontier models that serve our businesses, which is reported in Alphabet-level activities.\nAlphabet's structure is about helping each of our businesses prosper through strong leaders and independence.\nAccess and Technology for Everyone The Internet is one of the world’s most powerful equalizers; it propels ideas, people, and businesses large and small.\nOur mission to organize the world’s information and make it universally accessible and useful is as relevant today as it was when we were founded in 1998.\nSince then, we have evolved from a company that helps people find answers to a company that also helps people get things done.\nWe are focused on building an even more helpful Google for everyone, and we aspire to give everyone the tools they need to increase their knowledge, health, happiness, and success.\nGoogle Search helps people find information and make sense of the world in more natural and intuitive ways, with trillions of searches on Google every year.\nYouTube provides people with entertainment, information, and opportunities to learn something new and helps support the creator economy through the YouTube Partner Program.\nGoogle Cloud helps customers build for the future, improve productivity, reduce costs, and unlock new growth engines.\nWe continually innovate and build new products and features to help our users, partners, customers, and communities and have invested more than $200 billion in research and development in the last five years in support of these efforts.\n3.\nTable of Contents Alphabet Inc.\nMaking AI Helpful for Everyone We believe AI is a profound platform shift that can bring meaningful and positive change to people and societies across the world, and to our business.\nWe aim to build the most advanced, safe, and responsible AI through our full-stack approach, which spans AI-optimized infrastructure; world-class research, including models and tooling; and our products and platforms that bring AI to billions of people, developers, and enterprises.\nAt the foundation of our full-stack approach is our AI-optimized infrastructure — a key differentiator enabling us to power our own products, such as Search and YouTube, and support the services we provide to our Google Cloud customers.\nOur technical infrastructure allows us to use and offer our customers a range of AI accelerator options, including specialized Graphics Processing Units (GPUs) and our own custom-built Tensor Processing Units (TPUs), such as Ironwood, our seventh-generation TPU.\nWe are focused on driving efficiencies in our data centers, allowing us to leverage our technical infrastructure to deliver our products and services at an increasing scale while simultaneously enabling world-class research and model development.\nOver the last decade, our research teams have pushed the boundaries of AI forward, which is displayed through Gemini 3, our most intelligent AI model yet.\nDesigned to deliver advanced multimodal understanding, Gemini 3 represents our most capable iteration of agentic and generative coding technologies.\nGemini 3 integrates enhanced reasoning capabilities to support visualizations and interactive user experiences across our product ecosystem, including Search and the Gemini app.\nAs technology continues to improve rapidly, we are focused on bringing our latest AI advances to our products and platforms.\nWe continue to help our users access information and knowledge, express themselves, and get things done by embedding the power of generative AI and Gemini into our products and platforms.\nToday, all 15 of our half-billion-user products — including seven with two billion users — use our Gemini models.\nFor our Google Cloud customers, our offerings are helping organizations stay at the forefront of innovation with solutions such as Gemini Enterprise and Gemini for Google Workspace.\nGuided by our AI principles, we believe our approach to AI must be both bold and responsible.\nThat means developing AI in a way that maximizes the positive benefits to society while addressing its potential challenges.\nMoonshots Many companies get comfortable doing what they have always done, making only incremental changes.\nThis incrementalism leads to irrelevance over time, especially in technology, where change tends to be revolutionary, not evolutionary.\nOur early investments in AI started out as moonshots but are now incorporated into our core products and central to future developments.\nIn Other Bets, our fully autonomous driving technology company, Waymo, is now providing fully autonomous, paid ride-hailing services to customers in multiple cities.\nIsomorphic Labs is reimagining the drug discovery process from first principles, applying AI to accelerate the development of new medicines.\nWe continue to look toward the future and to invest for the long term, most notably for the application of AI to our products and services, as well as other frontier technologies such as quantum computing.\nPrivacy and Security We make it a priority to protect the privacy and security of our products, users, and customers, even if there are near-term financial consequences.\nWe do this by continuously investing in building products that are secure by default; strictly upholding responsible data practices that emphasize privacy by design; and building easy-to-use settings that put people in control.\nWe are continually enhancing these efforts over time, whether by enabling users to auto-delete their data, applying privacy technologies like on-device processing, giving people tools to control their experience, or advancing anti-malware, anti-phishing, and password security features.\nGoogle For reporting purposes Google comprises two segments: Google Services and Google Cloud.\nGoogle Services Serving Our Users We have always been committed to building helpful products that can improve the lives of millions of people worldwide.\nOur product innovations are what make our services widely used, and our brand one of the most recognized in the world.\nGoogle Services' core products and platforms include ads, Android, Chrome, devices, Gmail, Google Drive, Google Gemini, Google Maps, Google Photos, Google Play, Search, and YouTube, with broad and growing adoption by users around the world.\n4.\nTable of Contents Alphabet Inc.\nOur products and services have come a long way since the company was founded more than 25 years ago.\nWhile Google Search started as a way to find web pages, organized into ten blue links, we have driven technical advancements and product innovations that have transformed Google Search into a dynamic, multimodal experience.\nLarge language models have made it possible to express more natural language queries, vastly improving the types of questions users can ask, and the quality of results.\nFor example, AI Overviews makes it easier to ask Google anything and get a helpful response.\nAI Mode allows users to ask more nuanced questions that might have previously taken multiple searches, using Gemini’s advanced reasoning, thinking, and multimodal capabilities.\nThis drive to make information more accessible and helpful has led us over the years to improve the discovery and creation of digital content both on the web and through platforms like Google Play and YouTube.\nPeople are consuming many forms of digital content, including watching long and short form videos and podcasts, streaming TV, playing games, listening to music, reading books, and using apps.\nWorking with content creators and partners, we continue to build new ways for people around the world to create and find great digital content.\nFueling all of these great digital experiences are extraordinary platforms and devices.\nThat is why we continue to invest in platforms like our Android mobile operating system, Chrome browser, and Chrome operating system, as well as our family of devices.\nWe see tremendous potential for devices to be helpful and make people's lives easier by combining the best of our AI, software, and hardware.\nThis potential is reflected in our latest generation of devices, such as the new Pixel 10 series and the Pixel Watch 4.\nCreating products and services that people rely on every day is a journey that we are investing in for the long-term.\nHow We Make Money We have built world-class advertising technologies for advertisers, agencies, and publishers to power their digital marketing businesses.\nOur advertising solutions help millions of companies grow their businesses through our wide range of products across devices and formats, and we aim to ensure positive user experiences by serving the right ads at the right time and by building deep partnerships with brands and agencies.\nAI has been foundational to our advertising business for more than a decade.\nProducts like Demand Gen, Performance Max, and Product Studio use the full power of our AI to help advertisers find untapped and incremental conversion opportunities.\nGoogle Services generates revenues primarily by delivering both performance and brand advertising that appears on Google Search & other properties, YouTube, and Google Network partners' properties (\"Google Network properties\").\nWe continue to invest in both performance and brand advertising and seek to improve the measurability of advertising so advertisers understand the effectiveness of their campaigns.\n• Performance advertising creates and delivers relevant ads that users will click on leading to direct engagement with advertisers.\nPerformance advertising lets our advertisers connect with users while driving measurable results.\nOur ads tools allow performance advertisers to create simple text-based ads.\n• Brand advertising helps enhance users' awareness of and affinity for advertisers' products and services, through videos, text, images, and other interactive ads that run across various devices.\nWe help brand advertisers deliver digital videos and other types of ads to specific audiences for their brand-building marketing campaigns.\nWe have allocated substantial resources to stopping bad advertising practices and protecting users on the web.\nWe focus on creating the best advertising experiences for our users and advertisers in many ways, including filtering out invalid traffic, removing billions of bad ads from our systems every year, and closely monitoring the sites, apps, and videos where ads appear and blocklisting them when necessary to ensure that ads do not fund bad content.\nIn addition, Google Services generates revenues from products and services beyond advertising, including: • consumer subscriptions, which primarily include revenues from YouTube services, such as YouTube TV, YouTube Music and Premium, and NFL Sunday Ticket, as well as Google One, which offers access to our most capable Gemini models; • platforms , which primarily include revenues from Google Play sales of apps and in-app purchases; and • devices, which primarily include sales of the Pixel family of devices.\nGoogle Cloud Through our Google Cloud Platform and Google Workspace offerings, Google Cloud generates revenues primarily from consumption-based fees and subscriptions for infrastructure, platform, applications, and other cloud services.\nCustomers use Google Cloud in multiple ways such as: 5.\nTable of Contents Alphabet Inc.\n• AI-optimized Infrastructure: runs on our Cloud, at the edge, or in customers' data centers.\nIt can be used to migrate and modernize information technology (IT) systems and to train and serve various types of AI models.\nOur AI infrastructure delivers cost-performance for AI workloads.\nWe offer a range of AI accelerators, including our custom TPUs and specialized GPUs, as well as AI-optimized storage offerings, and efficient AI software.\n• Developer Platform: delivers   bizHtml+='<div style="column-count:2;column-gap:24px;margin-top:4px">';
  var left=[bizP[0]];
  if(bizP[1]) left.push('· '+bizP[1]);
  var right=[];
  if(bizP[2]) right.push('· '+bizP[2]);
  bizHtml+='<div>'+left.join('<br>')+'</div>';
  bizHtml+='<div>'+right.join('<br>')+'</div>';
  bizHtml+='</div>';
  html+='<div style="border-top:1px solid #000;padding:6px 12px;font-size:11px;line-height:1.55">'+bizHtml+'</div>';

  // AI Commentary: per-stock脚本 > PDF提取(mda) > 数据自生成 (4段VL风格, 全宽)
  var commentary=d.analyst&&d.analyst.commentary&&d.analyst.commentary.length?d.analyst.commentary:[
    '暂无数据', '数据暂不可用', '请先运行 engine.py 生成完整数据', ''
  ];
  var fromMda=d.analyst&&d.analyst.commentary_from_mda;
  var fromScript=d.analyst&&d.analyst.commentary_from_script;
  html+='<div style="border-top:1px solid #000;padding:6px 12px 10px 12px;font-size:10px;line-height:1.35">';
  if(fromScript){
    html+='<span style="font-size:15px;font-weight:700">AI Commentary: '+stockName+' '+latestYr+' (Custom)</span>';
  }else if(fromMda){
    html+='<span style="font-size:15px;font-weight:700">AI Commentary: '+(stockName+' MD&A Analysis')+'</span>';
  }else{
    html+='<span style="font-size:15px;font-weight:700">AI Commentary: '+stockName+' '+latestYr+'</span>';
  }
  // 先填充左边，再填充右边
  var commLeft=[], commRight=[];
  var half=Math.ceil(commentary.length/2);
  for(var ci=0;ci<commentary.length;ci++){
    if(commentary[ci]&&commentary[ci].length>5){
      if(ci<half) commLeft.push(commentary[ci]);
      else commRight.push(commentary[ci]);
    }
  }
  html+='<div style="display:flex;gap:24px;margin-top:6px">';
  html+='<div style="flex:1;min-width:0">';
  for(var ci=0;ci<commLeft.length;ci++){
    html+='<p style="text-align:justify;margin:0 0 8px 0;font-size:12px">'+commLeft[ci]+'</p>';
  }
  html+='</div>';
  html+='<div style="flex:1;min-width:0">';
  for(var ci=0;ci<commRight.length;ci++){
    html+='<p style="text-align:justify;margin:0 0 8px 0;font-size:12px">'+commRight[ci]+'</p>';
  }
  html+='</div></div>';
  html+='</div>';

  // Item 15 Footnotes — EPS 调整明细 (每项调整独立一行, 无数据留空)
  var footnotes = d.footnotes || [];
  if (footnotes.length > 0) {
    var fnMap = {};
    footnotes.forEach(function(f) {
      if (f.adj) fnMap[f.year] = {adj: f.adj || '', src: f.src || '', diff: f.diff || ''};
    });
    var fnYears = Object.keys(fnMap).sort();
    if (fnYears.length === 0) return;

    var abbrName = {'GS':'政府补贴','FV':'公允价值变动','FX':'汇兑收益','II':'投资收益','IM':'资产减值','EL':'权益法亏损','OG':'其他收益','CD':'A股扣非'};
    var allAbbrs = [];
    fnYears.forEach(function(y) {
      var src = fnMap[y].src || '';
      var parts = src.match(/([A-Z]+)\s+([+-][\d.]+)/g);
      if (parts) {
        parts.forEach(function(p) {
          var m = p.match(/([A-Z]+)\s+([+-][\d.]+)/);
          if (m && allAbbrs.indexOf(m[1]) < 0) allAbbrs.push(m[1]);
        });
      }
    });
    function fmtVal(v) {
      if (!v) return '—';
      var n = parseFloat(v);
      return n < 0 ? '(' + Math.abs(n).toFixed(2) + ')' : n.toFixed(2);
    }

    html += '<div style="border-top:1px solid #000;padding:4px 12px 2px">';
    html += '<table style="width:100%;border-collapse:collapse;font-size:10px;line-height:1.4">';
    var tdLbl = 'padding:2px 4px;border-right:1px solid #ddd';
    var tdCol = 'text-align:center;padding:2px 4px;border-right:1px solid #ddd';
    html += '<tr style="font-weight:700;border-bottom:1px solid #000"><td style="width:68px;padding:2px 4px;white-space:nowrap;' + tdLbl + '">FOOTNOTES</td>';
    fnYears.forEach(function(y) { html += '<td style="' + tdCol + ';font-size:8.5px">' + y + '</td>'; });
    html += '</tr>';

    // 每项调整独立一行
    allAbbrs.forEach(function(a) {
      var name = abbrName[a] || a;
      html += '<tr><td style="' + tdLbl + ';font-weight:700;color:#000;font-size:8.5px">' + name + '</td>';
      fnYears.forEach(function(y) {
        var src = fnMap[y].src || '';
        var m = src.match(new RegExp(a + '\\s+([+-][\\d.]+)'));
        html += '<td style="' + tdCol + ';font-size:8px">' + fmtVal(m ? m[1] : '') + '</td>';
      });
      html += '</tr>';
    });

    // 合计行放最后
    html += '<tr style="border-top:1px solid #000"><td style="' + tdLbl + ';font-weight:700;font-size:8.5px">adj.NP</td>';
    fnYears.forEach(function(y) { html += '<td style="' + tdCol + ';font-weight:700;font-size:8px">' + (fnMap[y].diff || '—') + '</td>'; });
    html += '</tr>';

    html += '</table></div>';
  }

  // Item 15 Footnotes — 数据源说明 (混合 AKShare + TDX 时显示)
  var dsNote = d.data_source_note || '';
  if (dsNote) {
    html += '<div style="border-top:1px solid #999;padding:3px 12px 2px;font-size:8px;color:#666;line-height:1.35">';
    html += '<span style="font-weight:700">数据源:</span> ' + dsNote;
    html += '</div>';
  }

  html+='<div style="font-size:8px;color:#666;text-align:right;margin-top:4px">股价: '+priceCcy+' | 财报数据: '+(meta.rpt_ccy||'CNY')+' | 2026-08-27</div>';
  app.innerHTML=html;

  // ECharts
  setTimeout(function(){
    // 裁剪K线到指标年份范围 (与 showYears 对齐, 最多15年)
    var minYr=showYears.length>0?parseInt(showYears[0],10):0;
    kl=kl.filter(function(k){return parseInt(k.date.substring(0,4),10)>=minYr;});
    // 补齐K线起始前的空月份，对齐指标表列
    var padMonths=[], padOHLC=[], firstKL=kl.length>0?kl[0].date:null;
    if(firstKL && showYears.length>0){
      var beginYr=parseInt(showYears[0],10), endYr=parseInt(firstKL.substring(0,4),10), endMo=parseInt(firstKL.substring(5,7),10);
      for(var y=beginYr; y<=endYr; y++){
        var maxM=(y===endYr)?endMo-1:12;
        for(var m=1; m<=maxM; m++){padMonths.push(y+'-'+(m<10?'0'+m:''+m));padOHLC.push([null,null,null,null]);}
      }
    }
    var dates=padMonths.concat(kl.map(function(k){return k.date;})),
        ohlc=padOHLC.concat(kl.map(function(k){return [Math.log(k.open),Math.log(k.close),Math.log(k.low),Math.log(k.high)];}));

    // RS line — VL 原生: (个股价/基期) ÷ (指数/基期) × 100, >100跑赢
    // 与 dates 等长，缺失月份填 null 避免 tooltip 索引错位
    var rsData=[];
    if(hsi.length>0){
      var hsiMap={};
      hsi.forEach(function(h){hsiMap[h.date]=h.close;});
      var baseS=null,baseH=null;
      dates.forEach(function(dt){
        var sc=kl.find(function(k){return k.date===dt;});
        var hc=hsiMap[dt];
        if(sc&&hc){
          if(baseS===null){baseS=sc.close;baseH=hc;}
          rsData.push(baseS?+((sc.close/baseS)/(hc/baseH)*100).toFixed(1):100);
        }else{
          rsData.push(null);
        }
      });
    }
    var series=[
      {name:stockName,type:'candlestick',data:ohlc,
        itemStyle:{color:'#ef232a',color0:'#14b143',borderColor:'#ef232a',borderColor0:'#14b143'}}
    ];

    var valLine=d.valuation_line||d.cf_line||[];
    var valMap={};
    valLine.forEach(function(c){valMap[c.date]=c.value;});
    var valSeries=dates.map(function(dt){
      var yr=dt.substring(0,4);
      var v=valMap[yr];
      return v!=null?Math.log(v):null;
    });
    if(valSeries.some(function(v){return v!=null;})){
      series.push({name:valLabel,type:'line',data:valSeries,
        lineStyle:{type:'solid',color:'#1976D2',width:1.2},symbol:'none'});
    }
    if(rsData.length>0){
      series.push({name:'RS',type:'line',data:rsData,
        lineStyle:{color:'#ef232a',width:1.2,type:'dotted'},symbol:'none',yAxisIndex:1});
    }

    // 年分隔线
    var yearLines=[];
    dates.forEach(function(d,i){if(d.endsWith('-01'))yearLines.push({xAxis:i,lineStyle:{color:'#ccc',width:1,type:'solid'}});});
    series[0].markLine={silent:true,animation:false,symbol:'none',data:yearLines,label:{show:false}};

    // 对数Y轴范围: 种子序列 [1,1.6,2.4,4,6] × 10^k + 4%缓冲区
    var pVals=kl.map(function(k){return k.close;}).filter(function(v){return v>0;});
    var pMin=Math.min.apply(null,pVals), pMax=Math.max.apply(null,pVals);
    var lnMin=Math.log(pMin), lnMax=Math.log(pMax), lnDl=lnMax-lnMin;
    var lnBuf=lnDl*0.04;
    var yMin=lnMin-lnBuf, yMax=lnMax+lnBuf;
    // 种子序列生成刻度标签 (自然对数统一)
    var tLo=Math.exp(yMin), tHi=Math.exp(yMax);
    var seeds=[1,1.6,2.4,4,6];
    var ticks=[], pow=Math.pow(10,Math.floor(Math.log(tLo)/Math.LN10)-1);
    while(pow<=tHi*1.1){
      seeds.forEach(function(m){
        var v=pow*m; if(v>=tLo&&v<=tHi) ticks.push(v);
      });
      pow*=10;
    }
    var logTicks=ticks.map(function(v){return Math.log(v);});
    var klineChart=echarts.init(document.getElementById('chart_kline'));
    // 统一 tooltip: 日期 → OHLC(从原始kl读) → CF → RS → PST
    var tooltipFmt=function(p){var di=p[0].dataIndex,h=p[0].axisValue,r='<b>'+h+' HKD</b>',mk=p[0].marker;var dk=kl.find(function(k){return k.date===h;});if(dk)r+='<br/>'+mk+' '+stockName+'<br/> open:'+dk.open.toFixed(2)+'<br/> close:'+dk.close.toFixed(2)+'<br/> low:'+dk.low.toFixed(2)+'<br/> high:'+dk.high.toFixed(2);for(var i=1;i<p.length;i++){var v=p[i].value,n=p[i].seriesName;if(v==null)continue;if(n==='RS')r+='<br/>'+p[i].marker+' '+n+': '+(v!=null?Number(v).toFixed(1):'-');else if(n.indexOf('x CF')>-1||n.indexOf('*BPS')>-1)r+='<br/>'+p[i].marker+' '+n+': '+Math.exp(Number(v)).toFixed(2);}var pv=volData[di];if(pv!=null){var up=dk&&dk.close>dk.open;r+='<br/><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+(up?'#ef232a':'#14b143')+';margin-right:4px;vertical-align:middle"></span>PST: '+pv.toFixed(2)+'%';}return r;};
    klineChart.setOption({
      tooltip:{trigger:'axis',axisPointer:{label:{show:false}},formatter:tooltipFmt},
      grid:{left:0,right:28,top:4,bottom:24},
      xAxis:{type:'category',data:dates,boundaryGap:false,
        axisPointer:{label:{show:false}},
        axisLabel:{fontSize:8,color:'#333',fontWeight:700,margin:2,
          formatter:function(v){return v&&v.endsWith('-01')?v.slice(0,4):'';},
          interval:0,showMinLabel:true,showMaxLabel:true},
        axisLine:{show:true,lineStyle:{color:'#999',width:0.5}},
        axisTick:{show:false},
        splitLine:{show:true,lineStyle:{color:'#ccc',width:0.5}}},
      yAxis:[
        {type:'value',min:yMin,max:yMax,
          axisLabel:{fontSize:9,color:'#000',
            formatter:function(v){var p=Math.exp(v);return p>=100?Math.round(p):p>=10?p.toFixed(0):p.toFixed(1);}},position:'right'},
        {type:'value',axisLabel:{fontSize:8,color:'#999'},splitLine:{show:false},position:'left'}],
      series:series
    });

    // Monthly Volume % — VL item 11: 按年份匹配股本
    var volData=[], totalShM=ly.TOTAL_SHARES;
    var shByYear={};
    showYears.forEach(function(y){shByYear[y]=(MT[y]||{}).TOTAL_SHARES;});
    var shFallback=shByYear[showYears[showYears.length-1]]||totalShM;
    dates.forEach(function(dt){
      var k=kl.find(function(k){return k.date===dt;});
      var yr=dt.substring(0,4);
      var sh=shByYear[yr]||shFallback;
      if(k&&k.volume&&sh){
        volData.push(+(k.volume/(sh*1e6)*100).toFixed(2));
      }else{volData.push(null);}
    });
    var vMax=0;
    volData.forEach(function(v){if(v!=null&&v>vMax)vMax=v;});
    // Y轴刻度: 比例缓冲+自适应interval, 向上取整到nice number
    var maxVol=vMax*1.2, interval=maxVol<=5?1:maxVol<=50?5:10;
    var ceilVol=Math.ceil(maxVol/interval)*interval||interval, step=ceilVol/3;
    var volChart=echarts.init(document.getElementById('chart_volume'));
    volChart.setOption({
      tooltip:{show:false},
      grid:{left:0,right:28,top:0,bottom:0,containLabel:false},
      xAxis:{type:'category',data:dates,show:false,boundaryGap:false,
        axisPointer:{show:true,type:'shadow',shadowStyle:{color:'rgba(25,118,210,.08)'},label:{show:false,formatter:''},handle:{show:false}}},
      yAxis:{type:'value',position:'left',min:0,max:ceilVol,splitNumber:3,
        axisLabel:{show:false},
        splitLine:{show:false},
        axisLine:{show:false},axisTick:{show:false}},
      series:[{name:'Vol%',type:'bar',data:volData,
        emphasis:{itemStyle:{color:'#ff6600'}},
        itemStyle:{color:function(p){var d=dates[p.dataIndex];return d&&d.endsWith('-01')?'#7b1fa2':'#1976D2';}},barWidth:'60%',
        markLine:{silent:true,symbol:'none',animation:false,
          data:[{yAxis:ceilVol,name:'',lineStyle:{color:'#000',width:3.0,type:'solid'}},
                {yAxis:step*2,name:'',lineStyle:{color:'#000',width:0.5,type:'solid'}},
                {yAxis:step,name:'',lineStyle:{color:'#000',width:0.5,type:'solid'}}]
        }}]
    });
    // DOM 标签画左侧 Percent/shares/traded — convertToPixel 取刻度 y 像素, 放在 chart_volume 外
    var volCnt=document.getElementById('chart_volume');
    volCnt.style.overflow='visible';
    var vals=[ceilVol,step*2,step], labels=['Percent','shares','traded'];
    var vsDiv=document.createElement('div');
    vsDiv.style.cssText='position:absolute;left:-72px;width:68px;top:0;bottom:0;pointer-events:none;z-index:1';
    vals.forEach(function(v,i){
      var py=volChart.convertToPixel({yAxisIndex:0},v);
      var d=document.createElement('div');
      d.style.cssText='position:absolute;left:0;right:0;top:'+(py||0)+'px;font-size:10px;font-weight:700;display:flex;justify-content:space-between;padding-right:4px';
      d.innerHTML='<span>'+labels[i]+'</span><span>'+Math.round(v)+'</span>';
      vsDiv.appendChild(d);
    });
    volCnt.appendChild(vsDiv);
    // K线图 ↔ 成交量图联动
    klineChart.group='vl'; volChart.group='vl'; echarts.connect('vl');
    // click K线 → 成交量柱高亮 + tooltip
    klineChart.on('click',function(p){
      volChart.dispatchAction({type:'downplay',seriesIndex:0});
      volChart.dispatchAction({type:'highlight',seriesIndex:0,dataIndex:p.dataIndex});
      volChart.dispatchAction({type:'showTip',seriesIndex:0,dataIndex:p.dataIndex});
    });
    // click 成交量图空白 → 取消高亮
    volChart.getZr().on('click',function(e){if(!e.target)volChart.dispatchAction({type:'downplay',seriesIndex:0});});

  },300);
})();
</script>
